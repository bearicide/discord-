<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATTBEAR Discord UI Asset Pack</title><link rel="stylesheet" href="../css/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:#1E1F22;color:#F2F3F5;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(1.7rem,5vw,3rem);margin:.2rem 0}p{color:#B5BAC1}
input{width:100%;min-height:46px;background:#111214;border:1px solid #3F4147;border-radius:8px;padding:0 14px;color:#F2F3F5;font-size:16px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.icon-card{background:#2B2D31;color:#F2F3F5;border:0;border-radius:8px;min-height:98px;padding:14px;display:grid;place-items:center;gap:8px;cursor:pointer}
.icon-card:hover,.icon-card:focus{background:#35373C;outline:2px solid #5865F2;outline-offset:1px}
.icon-card img{width:28px;height:28px;filter:invert(89%) sepia(6%) saturate(122%) hue-rotate(185deg) brightness(100%)}
.icon-card span{font-size:12px;color:#B5BAC1;word-break:break-word}
</style></head><body><main><h1>MATTBEAR Discord UI Asset Pack</h1>
<p>Original, lightweight SVG assets for Discord-adjacent community interfaces. No official Discord logos are included.</p>
<input id="q" type="search" placeholder="Search icons…" aria-label="Search icons"><div class="grid"><button class="icon-card" data-name="bell"><img src="../icons/community/bell.svg" alt=""><span>bell</span></button><button class="icon-card" data-name="bot"><img src="../icons/community/bot.svg" alt=""><span>bot</span></button><button class="icon-card" data-name="channel"><img src="../icons/community/channel.svg" alt=""><span>channel</span></button><button class="icon-card" data-name="headphones"><img src="../icons/community/headphones.svg" alt=""><span>headphones</span></button><button class="icon-card" data-name="megaphone"><img src="../icons/community/megaphone.svg" alt=""><span>megaphone</span></button><button class="icon-card" data-name="message"><img src="../icons/community/message.svg" alt=""><span>message</span></button><button class="icon-card" data-name="messages"><img src="../icons/community/messages.svg" alt=""><span>messages</span></button><button class="icon-card" data-name="mic"><img src="../icons/community/mic.svg" alt=""><span>mic</span></button><button class="icon-card" data-name="shield"><img src="../icons/community/shield.svg" alt=""><span>shield</span></button><button class="icon-card" data-name="users"><img src="../icons/community/users.svg" alt=""><span>users</span></button><button class="icon-card" data-name="branch"><img src="../icons/media/branch.svg" alt=""><span>branch</span></button><button class="icon-card" data-name="code"><img src="../icons/media/code.svg" alt=""><span>code</span></button><button class="icon-card" data-name="gamepad"><img src="../icons/media/gamepad.svg" alt=""><span>gamepad</span></button><button class="icon-card" data-name="image"><img src="../icons/media/image.svg" alt=""><span>image</span></button><button class="icon-card" data-name="music"><img src="../icons/media/music.svg" alt=""><span>music</span></button><button class="icon-card" data-name="repository"><img src="../icons/media/repository.svg" alt=""><span>repository</span></button><button class="icon-card" data-name="terminal"><img src="../icons/media/terminal.svg" alt=""><span>terminal</span></button><button class="icon-card" data-name="video"><img src="../icons/media/video.svg" alt=""><span>video</span></button><button class="icon-card" data-name="waveform"><img src="../icons/media/waveform.svg" alt=""><span>waveform</span></button><button class="icon-card" data-name="back"><img src="../icons/navigation/back.svg" alt=""><span>back</span></button><button class="icon-card" data-name="compass"><img src="../icons/navigation/compass.svg" alt=""><span>compass</span></button><button class="icon-card" data-name="external-link"><img src="../icons/navigation/external-link.svg" alt=""><span>external-link</span></button><button class="icon-card" data-name="forward"><img src="../icons/navigation/forward.svg" alt=""><span>forward</span></button><button class="icon-card" data-name="home"><img src="../icons/navigation/home.svg" alt=""><span>home</span></button><button class="icon-card" data-name="menu"><img src="../icons/navigation/menu.svg" alt=""><span>menu</span></button><button class="icon-card" data-name="search"><img src="../icons/navigation/search.svg" alt=""><span>search</span></button><button class="icon-card" data-name="settings"><img src="../icons/navigation/settings.svg" alt=""><span>settings</span></button><button class="icon-card" data-name="active"><img src="../icons/status/active.svg" alt=""><span>active</span></button><button class="icon-card" data-name="archive"><img src="../icons/status/archive.svg" alt=""><span>archive</span></button><button class="icon-card" data-name="busy"><img src="../icons/status/busy.svg" alt=""><span>busy</span></button><button class="icon-card" data-name="idle"><img src="../icons/status/idle.svg" alt=""><span>idle</span></button><button class="icon-card" data-name="offline"><img src="../icons/status/offline.svg" alt=""><span>offline</span></button><button class="icon-card" data-name="online"><img src="../icons/status/online.svg" alt=""><span>online</span></button></div>
<script>const q=document.querySelector('#q');q.addEventListener('input',()=>document.querySelectorAll('.icon-card').forEach(x=>x.hidden=!x.dataset.name.includes(q.value.toLowerCase())));</script>
</main></body></html>
